
name: Assignment Portal CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python
        run: '& "D:\Python312\python.exe" --version'

      - name: Install dependencies
        run: '& "D:\Python312\python.exe" -m pip install -r requirements.txt'

      - name: Run automated tests
        id: tests
        continue-on-error: true
        run: '& "D:\Python312\python.exe" -m pytest test_app.py -v --junitxml=pytest-results.xml'

      - name: Send JSON report to localhost
        if: always() && steps.tests.outcome != 'skipped'
        run: '& "D:\Python312\python.exe" send_report.py'

      - name: Send Gmail test report
        if: always() && steps.tests.outcome != 'skipped'
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
        run: '& "D:\Python312\python.exe" send_email.py'

      - name: Fail workflow if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
